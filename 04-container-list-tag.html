<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Container--List Tag</title>
  </head>
  <body>
    <!-- What is Container Tag? -->
    <!-- Container tags are used to group and organize content on a webpage. They provide a way to structure the HTML document and apply styles or scripts to specific sections of the content. -->
    <!-- Examples of container tags include: <div>, <section>, <article>, <header>, <footer>, <nav> -->

    <!-- What is List Tag? -->
    <!-- List tags are used to create ordered or unordered lists in HTML. They help to organize and present information in a structured manner. -->

    <!-- Examples of list tags include: <ul> (unordered list), <ol> (ordered list), <li> (list item) -->

    <h1>My Favorite Fruits</h1>
    <ul>
      <li>Apple</li>
      <li>Banana</li>
      <li>Orange</li>
      <li>Mango</li>
    </ul>

    <h2>Steps to Make a Cup of Tea</h2>
    <ol>
      <li>Boil water.</li>
      <li>Add tea leaves or tea bag.</li>
      <li>Let it steep for a few minutes.</li>
      <li>Add milk and sugar if desired.</li>
      <li>Stir and enjoy your tea!</li>
    </ol>
  </body>
</html>
