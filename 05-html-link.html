<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Link</title>
</head>
<body>
    <!-- 01. What is the use of the anchor tag in HTML? -->
    <!-- The anchor tag (<a>) in HTML is used to create hyperlinks. It allows you to link to other web pages, files, or specific sections within the same page. The anchor tag can also be used to create email links or telephone links. -->

    <!-- 02. Write the syntax of the anchor tag. -->
    <!-- The syntax of the anchor tag is as follows:
    <a href="URL">Link Text</a>
    Where "URL" is the destination of the link and "Link Text" is the clickable text that will be displayed on the webpage. -->

    <!-- 03. What is the function of the href attribute? -->
    <!-- The href attribute in the anchor tag specifies the URL of the page the link goes to. It stands for "hypertext reference" and is used to define the destination of the hyperlink. When a user clicks on the link, they will be directed to the URL specified in the href attribute. -->

    <!-- 04. Which attribute is used to open a link in a new tab? -->
    <!-- The target attribute is used to specify where to open the linked document. To open a link in a new tab, you can set the target attribute to "_blank". 

    For example:
    <a href="https://www.example.com" target="_blank">Visit Example</a -->
    
    
        <!-- link to another website -->
        <a href="https://www.google.com/?hl=en-US&authuser=1">Visit Google</a>

        <!-- open link in new tab -->
        <a href="https://www.w3schools.com/whatis/" target="_top">Web Development Roadmap</a>
</body>
</html>
