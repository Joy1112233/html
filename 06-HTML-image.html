<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Image</title>
</head>
<body>

                                    <!-- Theory -->
    
    <!-- Three Ways to Add an Image in HTML -->

        <!-- Online Image (Using Image URL) -->
        <!-- You can use an image directly from the internet by copying its image URL. -->
        <!-- <img src="https://example.com/image.jpg" alt="Online Image"> -->

        <!-- Local Image (Same Folder) -->
        <!-- If the image file is saved in the same folder as your HTML file, you only need to write the image name. -->
        <!-- <img src="image.jpg" alt="Local Image"> -->

        <!-- Folder Image (Inside a Subfolder) -->
        <!-- If the image is inside another folder (for example: images folder), you must include the folder name in the path. -->
        <!-- <img src="images/photo.jpg" alt="Folder Image"> -->

        
        <!-- HTML <img> Tag Explanation -->
        <!-- The <img> tag is used in HTML to display images on a web page.It is an empty tag, which means it does not have a closing tag. -->
        <!-- <img src="image.jpg" alt="Description"> -->

        
        <!-- Important Attributes -->

        <!-- src (Source) -->
        <!-- Specifies the path or URL of the image. It tells the browser where the image file is located. -->
        <!-- <img src="photo.jpg"> -->

        <!-- alt (Alternative Text) -->
        <!-- Provides a text description of the image. This is important for accessibility and is displayed if the image cannot be loaded. -->
        <!-- <img src="photo.jpg" alt="A beautiful scenery"> -->   

        <!-- width and height -->
        <!-- These attributes specify the width and height of the image in pixels. -->  
        <!-- <img src="photo.jpg" alt="A beautiful scenery" width="300" height="200"> -->



                                                <!-- Practical -->

        <!-- Example of an online image -->
        <h2>Online Image</h2>
        <img src="https://www.w3schools.com/images/w3schools_green.jpg" alt="W3Schools Logo">
        <br>
        <!-- Example of Local Image -->
        <h2>Local Image</h2>
        <img src="/web-design-development.jpg" alt="web design and development" height="200px" width="200px">

        <br>
        <!-- Example of Folder Image -->
        <h2>Folder Image</h2>
        <img src="/images/flower-image.jpg" alt="A beautiful flower" width="300 height="200">


</body>
</html>
